name: Dubai Driver Job Outreach

on:
  # Safely validate the workflow on relevant commits; push runs are preview-only.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/job-outreach.yml"
      - "scripts/prepare_emails.py"
      - "data/companies.csv"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview only, or send verified enquiries"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - send
      confirm_send:
        description: 'Type YES only after reviewing contacts and draft'
        required: false
        default: "NO"
        type: choice
        options:
          - "NO"
          - "YES"

permissions:
  contents: read

jobs:
  outreach:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare drafts / send if explicitly confirmed
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'preview' }}
          CONFIRM_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_send || 'NO' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python scripts/prepare_emails.py

      - name: Upload email drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubai-driver-email-drafts
          path: outbox/*.eml
          if-no-files-found: ignore
          retention-days: 7
